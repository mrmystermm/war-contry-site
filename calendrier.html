<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>War Contry — Calendrier de l'Avent 2026</title><meta name="description" content="Ouvre une case par jour du 1er au 24 décembre 2026 sur War Contry."><meta name="theme-color" content="#060d1a"><link rel="icon" href="assets/favicon.png"><meta property="og:image" content="assets/banniere-war-contry.png"><link rel="stylesheet" href="style.css"></head><body>
<div class="cal-bg"></div>
<nav class="nav"><div class="nav-in"><a class="brand" href="index.html"><img src="assets/favicon.png" alt=""><span>WAR CONTRY</span></a><div class="links"><a href="index.html">Événement de Noël</a><a href="calendrier.html" class="cta on">🎁 Calendrier de l'Avent</a><a href="votes.html">🗳️ Votes</a><a href="connexion.html">👤 Connexion</a></div></div></nav>
<header class="page-head"><span class="eyebrow">❄ Noël 2026</span><h1>Calendrier de l'Avent</h1><p>Une case par jour. Des surprises t'attendent…</p><div class="date" id="dateLabel"></div></header>
<main><div class="grid" id="calendar"></div>
<p class="note">Une case passée ne peut pas être ouverte plus tard. Les cases futures restent verrouillées.</p>
</main>
<footer><b>WAR CONTRY</b><br>Événement de Noël 2026</footer>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Case du jour 🎁</h2><p id="modalText"></p><div class="actions"><button class="secondary" id="cancel">Fermer</button></div></div></div>
<script src="snow.js"></script>
<script>
const year=2026,month=11;
const $=id=>document.getElementById(id),calendar=$('calendar'),modal=$('modal');
const now=new Date(),localToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const start=new Date(year,month,1),end=new Date(year,month,24);
if(localToday<start)$('dateLabel').textContent='Ouverture le 1er décembre 2026';
else if(localToday>end)$('dateLabel').textContent='Calendrier terminé — merci !';
else $('dateLabel').textContent='Aujourd’hui : '+localToday.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
// Ordre mélangé fixe : tous les joueurs voient les cases au même emplacement.
const shuffledDays=[3,16,20,1,12,7,23,5,18,10,2,14,21,8,24,4,17,11,6,19,13,22,9,15];
for(const day of shuffledDays){
 const d=new Date(year,month,day),tile=document.createElement('button');
 tile.type='button';tile.className='tile';
 const past=localToday>d,future=localToday<d,isToday=+d===+localToday;
 let icon='🎁',hint='Ouvrir aujourd’hui';
 if(past){tile.classList.add('missed');icon='🔒';hint='Manquée';tile.disabled=true}
 else if(future){icon='🔒';hint='Pas encore';tile.disabled=true}
 else tile.classList.add('today');
 tile.innerHTML='<span class="num">'+String(day).padStart(2,'0')+'</span><span class="gift">'+icon+'</span><span class="hint">'+hint+'</span>';
 if(isToday)tile.onclick=()=>openModal(day);
 calendar.appendChild(tile);
}
function openModal(day){
 $('modalTitle').textContent='Case '+day+' 🎁';
 $('modalText').textContent='Cette récompense se réclame directement en jeu sur le serveur War Contry. Connecte-toi au serveur pour la récupérer !';
 modal.classList.add('show');
}
$('cancel').onclick=()=>modal.classList.remove('show');
</script><script src="auth-nav.js"></script><script src="preferences.js"></script></body></html>
