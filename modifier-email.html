<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060d1a"><title>Modifier mon adresse e-mail — War Contry</title><link rel="stylesheet" href="auth.css"></head>
<body><nav class="auth-nav"><a class="brand" href="index.html">WAR CONTRY</a><a href="mon-compte.html">← Mon compte</a></nav>
<main class="auth-wrap"><section class="auth-card">
<span class="eyebrow">Paramètres du compte</span><h1>Modifier mon adresse e-mail</h1>
<p>Adresse actuelle : <strong id="current-email">Chargement…</strong></p>
<p>Saisis ta nouvelle adresse. Nous lui enverrons un lien de confirmation. Ton adresse actuelle ne changera qu'après cette confirmation.</p>
<form id="email-form">
<label class="field"><span>Nouvelle adresse e-mail</span><input id="new-email" type="email" maxlength="254" autocomplete="email" required></label>
<label class="field"><span>Mot de passe actuel</span><input id="current-password" type="password" maxlength="128" autocomplete="current-password" required></label>
<button class="primary" id="save-email" type="submit">Envoyer le lien de confirmation</button>
</form>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="auth-links"><a href="mon-compte.html">Retour à mon compte</a></div>
</section></main><footer>WAR CONTRY · Espace joueur</footer>
<script src="preferences.js"></script><script src="modifier-email.js?v=2"></script></body></html>
