<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060d1a"><title>Code de connexion — War Contry</title><link rel="stylesheet" href="auth.css"></head>
<body><nav class="auth-nav"><a class="brand" href="index.html">WAR CONTRY</a><a href="index.html">← Retour au site</a></nav>
<main class="auth-wrap"><section class="auth-card"><span class="eyebrow">Sécurité du compte</span><h1>Vérification en deux étapes</h1><p>Un code à 6 chiffres a été envoyé à ton adresse e-mail. Il expire dans 10 minutes.</p>
<form id="code-form"><label class="field"><span>Code de sécurité</span><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary">Vérifier et se connecter</button></form>
<div id="notice" class="notice" role="status" aria-live="polite"></div><div class="auth-links"><a href="connexion.html">Retour à la connexion</a></div></section></main><footer>WAR CONTRY · Espace joueur</footer>
<script>
(()=>{const API="https://warcontry-accounts.mr-mystermm.workers.dev";const id=new URLSearchParams(location.search).get("challenge")||"";const form=document.getElementById("code-form"),notice=document.getElementById("notice");function show(t,type){notice.textContent=t;notice.className="notice "+(type||"")}if(!id){form.hidden=true;show("Demande de connexion invalide. Recommence la connexion.","error");return}form.addEventListener("submit",async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;show("Vérification en cours…");try{const response=await fetch(API+"/verify-login-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challengeId:id,code:document.getElementById("code").value.trim()})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||"Vérification impossible.");localStorage.setItem("wc_account_token",data.token);location.replace("mon-compte.html")}catch(error){show(error.message,"error");button.disabled=false}})})();
</script><script src="preferences.js"></script></body></html>
