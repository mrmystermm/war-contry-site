<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060d1a"><title>Changer mon mot de passe — War Contry</title><link rel="stylesheet" href="auth.css"></head>
<body><nav class="auth-nav"><a class="brand" href="index.html">WAR CONTRY</a><a href="securite.html">← Sécurité</a></nav>
<main class="auth-wrap"><section class="auth-card">
<span class="eyebrow">Protection du compte</span><h1>Changer mon mot de passe</h1>
<p>Choisis un nouveau mot de passe pour ton compte War Contry. Il doit contenir entre 12 et 128 caractères.</p>
<form id="password-form">
<label class="field"><span>Mot de passe actuel</span><input id="current-password" type="password" maxlength="128" autocomplete="current-password" required></label>
<label class="field"><span>Nouveau mot de passe</span><input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<label class="field"><span>Confirmer le nouveau mot de passe</span><input id="confirm-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<button class="primary" id="save-password" type="submit">Enregistrer le nouveau mot de passe</button>
</form>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="auth-links"><a href="securite.html">Retour à la sécurité</a></div>
</section></main><footer>WAR CONTRY · Espace joueur</footer>
<script src="preferences.js"></script><script src="changer-mot-de-passe.js?v=1"></script></body></html>
