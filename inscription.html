<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060d1a">
<title>Inscription — War Contry</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>
<nav class="auth-nav"><a class="brand" href="index.html">WAR CONTRY</a><a href="index.html">← Retour au site</a></nav>
<main class="auth-wrap">
<section class="auth-card">
<span class="eyebrow">Espace joueur</span>
<h1>Créer un compte</h1>
<p>Inscris-toi avec ton pseudo Minecraft et ton adresse e-mail.</p>
<form id="register-form">
<label class="field"><span>Pseudo Minecraft</span><input id="username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" autocomplete="username"><small class="field-help">3 à 16 caractères : lettres, chiffres et _ uniquement. Aucun espace ni accent.</small></label>
<label class="field"><span>Adresse e-mail</span><input id="email" type="email" required autocomplete="email"></label>
<label class="field"><span>Mot de passe (12 caractères minimum)</span><input id="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
<button class="primary">Créer mon compte</button>
</form>
<div id="register-connected" class="notice ok" hidden>
<strong>Ton compte est vérifié et tu es connecté !</strong>
<p>Tu peux maintenant accéder à ton espace personnel.</p>
<a href="mon-compte.html">Accéder à mon compte</a>
</div>
<div class="auth-links"><a href="connexion.html">Déjà inscrit ? Connexion</a></div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
</section>
</main>
<footer>WAR CONTRY · Espace joueur</footer>
<script src="auth.js"></script>
</body>
</html>
